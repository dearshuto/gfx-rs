[workspace]
resolver = "2"
members = [
    "gfx",
    #   "sj",
    "gfx-egui",
    "gfx-interface",
    "gfx-vulkano",
    "gfx-wgpu",
    "examples",
    "run-wasm",
    "vi-rs",
    #	"examples/clear_color",
    #	"examples/hello_graphics_pipeline",
    #	"examples/hello_3d",
    #	"examples/hello_compute",
    #	"examples/hello_draw_indexed",
    #	"examples/mandelbrot",
    #	"examples/shader_setup",
    #	"examples/simple_window",
]

[workspace.dependencies]
bitflags = "1.3.2"
bytemuck = "1.7"
egui = { version = "0.16", features = ["convert_bytemuck"] }
futures = "0.3.27"
image = "0.24.5"
naga = { version = "0.13.0", features = [
    "glsl-in",
    "wgsl-in",
    "spv-out",
    "wgsl-out",
    "hlsl-out",
] }
nalgebra-glm = "0.18.0"
raw-window-handle = "0.5.0"
rspirv = { git = "https://github.com/gfx-rs/rspirv.git", rev = "c7305b8" }
shaderc = "0.7"
tobj = "3.2.1"
uuid = { version = "1.3.0", features = ["v4", "js"] }
wasm-bindgen = "0.2.84"
winit = "0.27.1"
